<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Web API Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      color: #8ab4f8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .icon { font-size: 20px; }
    .badge {
      font-size: 10px;
      background: #2d4a2d;
      color: #4caf50;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: normal;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #8ab4f8;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .toggle-row span {
      font-size: 13px;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #333;
      border-radius: 24px;
      transition: 0.3s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #e0e0e0;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider {
      background: #4caf50;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      background: #16213e;
      border: 1px solid #333;
      line-height: 1.5;
    }
    .status.connected { border-color: #4caf50; color: #4caf50; }
    .status.disconnected { border-color: #f44336; color: #f44336; }
    .status.idle { border-color: #666; color: #888; }
    .status.warning { border-color: #ff9800; color: #ff9800; }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #8ab4f8;
      color: #1a1a2e;
    }
    .btn-secondary {
      background: #333;
      color: #e0e0e0;
    }
    .cookie-info {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
      line-height: 1.6;
    }
    .cookie-info .label {
      color: #aaa;
    }
    .cookie-info .value {
      color: #8ab4f8;
    }
    .cookie-info .value.ok { color: #4caf50; }
    .cookie-info .value.missing { color: #f44336; }
  </style>
</head>
<body>
  <h1>
    <span class="icon">🌉</span>
    Gemini API Bridge
    <span class="badge">Direct API</span>
  </h1>

  <div class="toggle-row">
    <span>Enable Bridge</span>
    <label class="switch">
      <input type="checkbox" id="enableToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="field">
    <label for="serverUrl">Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:3456" />
  </div>

  <div class="toggle-row">
    <span>Auto-sync Cookies</span>
    <label class="switch">
      <input type="checkbox" id="cookieToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="syncBtn">🔄 Sync Cookies Now</button>
    <button class="btn btn-secondary" id="testBtn">Test</button>
  </div>

  <div class="status idle" id="statusBox">Not connected</div>

  <div class="cookie-info" id="cookieInfo"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
